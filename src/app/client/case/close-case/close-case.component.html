<div class="card mt-1">
  <div class="card-body">

    <p class="mb-3">
      Der Fall <strong>{{ caseToClose().name }}</strong> wird abgeschlossen. Die
      Gesamtberatungsdauer wird dabei festgeschrieben.
    </p>

    <div class="row g-2">
      <div class="col-12">
        <div class="text-secondary small mb-1">Abgeschlossen am</div>
        <div class="input-group">
          <input
            class="form-control"
            placeholder="yyyy-mm-dd"
            name="dp"
            [ngModel]="endDate()"
            (ngModelChange)="endDate.set($event)"
            [maxDate]="today"
            ngbDatepicker
            #d="ngbDatepicker"
          />
          <button class="btn btn-outline-secondary" (click)="d.toggle()" type="button">
            <fa-icon class="text-primary" [icon]="faCalendar"></fa-icon>
          </button>
        </div>
      </div>

      <div class="col-12">
        <app-select-box [categoryType]="catForwarded"
                        [label]="Label.REFERRED_TO"
                        (catValue)="selectOrganization($event)"/>
      </div>
    </div>

    <div class="mt-3">
      <button class="btn btn-sm btn-outline-success"
              [disabled]="saving()"
              (click)="closeCase()">
        Fall abschließen
      </button>
    </div>

  </div>
</div>
